name: Publish ASYL client
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      VITE_API_URL: ${{ vars.ASYL_API_URL }}
      VITE_SITE_URL: https://hixman08.github.io/turkish
      VITE_BASE_PATH: /turkish/
      VITE_APPLICATIONS_ENABLED: ${{ vars.ASYL_APPLICATIONS_ENABLED || 'false' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Require deployed API before replacing the live client
        run: |
          if [ -z "$VITE_API_URL" ]; then
            echo '::error::Set repository variable ASYL_API_URL to the deployed HTTPS API origin. The previous live site is preserved.'
            exit 1
          fi
      - run: npm ci --no-audit --no-fund
      - run: npm run build:client
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v5
        with:
          path: client/dist
      - uses: actions/deploy-pages@v4
        id: deployment
