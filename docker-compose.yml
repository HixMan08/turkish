services:
  db:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: asyl
      POSTGRES_USER: asyl
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U asyl -d asyl"]
      interval: 5s
      timeout: 5s
      retries: 20
  server:
    build:
      context: .
      args:
        VITE_SITE_URL: ${VITE_SITE_URL:-http://localhost:3001}
        VITE_APPLICATIONS_ENABLED: ${VITE_APPLICATIONS_ENABLED:-false}
        VITE_ANALYTICS_SCRIPT_URL: ${VITE_ANALYTICS_SCRIPT_URL:-}
        VITE_ANALYTICS_WEBSITE_ID: ${VITE_ANALYTICS_WEBSITE_ID:-}
    restart: unless-stopped
    init: true
    env_file: .env
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      DATABASE_URL: postgresql://asyl:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/asyl
      HOST: 0.0.0.0
      PORT: 3001
    command: ["sh", "-c", "npm run db:migrate && npm run db:seed && npm start"]
    ports:
      - "127.0.0.1:3001:3001"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s
volumes:
  postgres_data:
